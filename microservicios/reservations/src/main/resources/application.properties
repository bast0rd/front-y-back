spring.application.name=reservations

server.port=8082

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/9ef09e62-9232-4a84-a7ac-cddca637cd2e/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://14010fcc-7287-4419-86db-772a960bfb8c
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}
internal.api.key=${INTERNAL_API_KEY:andesstay-internal-2026}

# ---------------- RabbitMQ (sin secretos en el código) ----------------
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASS:guest}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:/}
# Si el broker está caído, no dejar colgada la petición HTTP más de 3 s
spring.rabbitmq.connection-timeout=3000ms

# Nombres de exchange y routing keys CENTRALIZADOS (deben coincidir con los de notify)
app.rabbit.exchanges.direct=cmd.direct
app.rabbit.routing-keys.email-direct=email.send
app.rabbit.routing-keys.housekeeping-direct=housekeeping.ticket
app.rabbit.routing-keys.voucher-direct=voucher.gen


spring.datasource.url=jdbc:oracle:thin:@basedatosandesstay_medium
spring.datasource.username=ADMIN
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect