spring.application.name=notify
server.port=8083

# ---------------------------------------------------------------
# Conexión a RabbitMQ (sin secretos en el código: variables de entorno)
#   CloudAMQP : RABBIT_ADDRESSES=amqps://usuario:clave@leopard.lmq.cloudamqp.com/vhost
#   Docker    : RABBIT_ADDRESSES=rabbit1:5672,rabbit2:5672  RABBIT_USER=...  RABBIT_PASS=...
# ---------------------------------------------------------------
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASS:guest}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:/}

# ACK manual: cada consumidor confirma (ack) o rechaza (nack) explícitamente.
# El reintento lo controla MessageAckHandler, por eso NO se usa spring.rabbitmq.listener.simple.retry.*
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------------------------------------------------------------
# Topología RabbitMQ CENTRALIZADA (nombres de exchanges, colas y routing keys)
# ---------------------------------------------------------------
# true en Docker con clúster de 2 nodos (quorum queues). false en CloudAMQP ya existente.
app.rabbit.quorum-queues=${RABBIT_QUORUM:false}

app.rabbit.exchanges.direct=cmd.direct
app.rabbit.exchanges.topic=cmd.topic
app.rabbit.exchanges.dlx=cmd.dead.dlx

app.rabbit.queues.email=q.cmd.email
app.rabbit.queues.email-dlq=q.cmd.email.dlq
app.rabbit.queues.housekeeping=q.cmd.housekeeping
app.rabbit.queues.housekeeping-dlq=q.cmd.housekeeping.dlq
app.rabbit.queues.voucher=q.cmd.voucher
app.rabbit.queues.voucher-dlq=q.cmd.voucher.dlq

app.rabbit.routing-keys.email-direct=email.send
app.rabbit.routing-keys.email-topic=email.*
app.rabbit.routing-keys.housekeeping-direct=housekeeping.ticket
app.rabbit.routing-keys.housekeeping-topic=housekeeping.#
app.rabbit.routing-keys.voucher-direct=voucher.gen
app.rabbit.routing-keys.voucher-topic=voucher.*

# Reintentos ante errores recuperables antes de mandar el mensaje a la DLQ
app.rabbit.retry.max-attempts=3
app.rabbit.retry.initial-interval-ms=1000
app.rabbit.retry.multiplier=2.0
