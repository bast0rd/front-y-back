spring.application.name=admin-rabbit
server.port=8086

# Seguridad JWT (Azure AD) - mismo tenant/API que los demás micros
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/9ef09e62-9232-4a84-a7ac-cddca637cd2e/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://14010fcc-7287-4419-86db-772a960bfb8c

# Management HTTP API de RabbitMQ (variables de entorno; sin secretos en el código)
#   CloudAMQP: RABBIT_MGMT_URL=https://leopard.lmq.cloudamqp.com  RABBIT_VHOST=<vhost>
#   Docker   : RABBIT_MGMT_URL=http://rabbit1:15672                RABBIT_VHOST=/
rabbit.management.url=${RABBIT_MGMT_URL:http://localhost:15672}
rabbit.management.username=${RABBIT_USER:guest}
rabbit.management.password=${RABBIT_PASS:guest}
rabbit.management.vhost=${RABBIT_VHOST:/}
