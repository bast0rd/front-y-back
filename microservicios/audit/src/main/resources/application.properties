spring.application.name=audit

server.port=8085

app.kafka.enabled=false

# Seguridad JWT (Azure AD) - mismo tenant/API que los otros micros
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/9ef09e62-9232-4a84-a7ac-cddca637cd2e/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://14010fcc-7287-4419-86db-772a960bfb8c

# Base de datos Oracle (mismo wallet que catalog/reservations)
spring.datasource.url=jdbc:oracle:thin:@basedatosandesstay_medium
spring.datasource.username=ADMIN
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Kafka - consumer del tópico reservations.events

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.andesstay.audit.DTO